[project]
name = "spotify-fix"
version = "0.2.0"
description = "Utility tool to clean up reuploaded Spotify liked tracks, albums, and playlists using librespot and Zotify credentials."
authors = [
    {name = "G", email = "g@devnull.rip"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["spotify", "librespot", "zotify", "music", "cleanup", "playlist", "relink"]
dependencies = [
    "librespot (>=0.0.10,<0.0.11)",
    "requests (>=2.34.2,<3.0.0)"
]

[project.urls]
Homepage = "https://github.com/g-lok/spotify-library-fixer"
Repository = "https://github.com/g-lok/spotify-library-fixer"

[tool.poetry]
packages = [{include = "spotify_fix", from = "src"}]

[tool.poetry.scripts]
spotify-fix = "spotify_fix.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-bdd (>=9.0.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "graphifyy (>=0.9.100,<0.10.0)"
]
