[project]
name = "spotify-fix"
version = "0.1.0"
description = ""
authors = [
    {name = "G",email = "g@devnull.rip"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "librespot (>=0.0.10,<0.0.11)",
    "requests (>=2.34.2,<3.0.0)"
]

[tool.poetry]
packages = [{include = "spotify_fix", from = "src"}]

[tool.poetry.scripts]
spotify-fix = "spotify_fix.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-bdd (>=9.0.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "graphifyy (>=0.9.100,<0.10.0)"
]
